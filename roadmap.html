<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PathIQ | Your Roadmap</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap"
        rel="stylesheet">
</head>

<body>

<header class="navbar">

    <a href="dashboard.html" class="logo">
        Path<span>IQ</span><small>✦</small>
    </a>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Home</a>
        <a href="login.html" class="dashboard-logout">Logout</a>
    </nav>

</header>


<main class="roadmap-page">

    <section class="roadmap-intro">

        <div class="roadmap-badge">
            ✦ your learning path
        </div>

        <h1>
            Your roadmap to
            <span>level up ♡</span>
        </h1>

        <p>
            Follow your personalized learning path,
            one skill at a time.
        </p>

    </section>


    <section class="roadmap-main-card">

        <div class="roadmap-main-heading">

            <div>

                <span class="mini-label">
                    PERSONALIZED ROADMAP
                </span>

                <h2 id="roadmapCareer">
                    Loading your career...
                </h2>

            </div>

            <span class="roadmap-main-decoration">
                ✦
            </span>

        </div>


        <div id="roadmapPageList">

            <div class="roadmap-page-loading">

                <span>✦</span>

                <p>
                    Building your roadmap...
                </p>

            </div>

        </div>

    </section>


    <section class="roadmap-note">

        <span>♡</span>

        <p>
            Progress doesn't have to be perfect.
            Just keep taking the next step.
        </p>

        <span>✦</span>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
