<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PathIQ | Welcome Back</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap"
          rel="stylesheet">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Path<span>IQ</span><small>✦</small>
    </a>

    <nav>
        <a href="index.html">Home</a>

        <a href="register.html">
            Create account
        </a>
    </nav>

</header>


<main class="auth-page login-page">

    <div class="auth-decoration decoration-one">✦</div>
    <div class="auth-decoration decoration-two">♡</div>
    <div class="auth-decoration decoration-three">✧</div>


    <section class="register-card login-card">

        <div class="register-intro">

            <div class="auth-badge">
                ♡ welcome back
            </div>

            <h1>
                Ready to find
                <span>your path again? ✦</span>
            </h1>

            <p>
                Log in and continue building the career
                you actually want.
            </p>

        </div>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="loginEmail">
                    Email address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button">

                Let's go
                <span>→</span>

            </button>


            <p id="loginMessage" class="form-message"></p>


        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

            ♡

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
